<!DOCTYPE html>
<html>
<head>
    <title>Decrypt File</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h2 class="mb-4">🔓 Decrypt File</h2>
        <form method="POST" enctype="multipart/form-data">
            <div class="form-group">
                <label for="file">Choose Encrypted File:</label>
                <input type="file" name="file" class="form-control" required />
            </div>
            <div class="form-group">
                <label for="password">Enter the Password:</label>
                <input type="password" name="password" class="form-control" required />
            </div>
            <button type="submit" class="btn btn-primary">Decrypt & Download</button>
            <a href="/" class="btn btn-secondary">⬅️ Back to Home</a>
        </form>
    </div>
</body>
</html>
